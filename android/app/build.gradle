plugins { id 'com.android.application' }
def vc = (System.getenv('VERSION_CODE') ?: '1').toInteger()
android {
    namespace 'com.andreluis29.kagenoken'
    compileSdk 34
    defaultConfig {
        applicationId 'com.andreluis29.kagenoken'
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "1." + vc
    }
    signingConfigs {
        release {
            storeFile file('kage.keystore')
            storePassword 'kagenoken'
            keyAlias 'kage'
            keyPassword 'kagenoken'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
