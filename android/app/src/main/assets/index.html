<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kage no Ken — Lâmina das Sombras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Yuji+Syuku&display=swap">
<style>
:root{--gold:#d9b46a;--ink:#0d0508;--red:#d8352a;--paper:#f3e6d0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:'Shippori Mincho',Georgia,serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(10,0,6,.55) 100%)}
#grain{position:fixed;inset:-50%;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:gr .4s steps(3) infinite}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#hud{position:fixed;inset:0;pointer-events:none}
.bar{position:absolute;height:9px;background:linear-gradient(#120509,#2a0d14);border:1px solid rgba(217,180,106,.55);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);overflow:hidden;border-radius:1px}
.bar>i{display:block;height:100%;width:100%;transition:width .1s}
#pl{position:absolute;left:14px;top:12px;display:flex;gap:9px;align-items:flex-start}
.seal{pointer-events:auto;cursor:pointer;width:34px;height:34px;background:var(--red);color:#fff1dc;font-family:'Yuji Syuku',serif;font-size:24px;display:flex;align-items:center;justify-content:center;border-radius:3px;box-shadow:inset 0 0 0 2px rgba(255,230,200,.25),0 2px 10px rgba(0,0,0,.6);transform:rotate(-4deg)}
#pl .lbl{font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:4px;text-shadow:0 1px 3px #000}
#hp{position:relative;width:190px;height:10px}#hp>i{background:linear-gradient(#ff6b52,#b0241a 55%,#6e120c)}
#hpGhost{position:absolute;inset:0;background:rgba(255,220,200,.35);width:100%;transition:width .6s .25s}
#ki{position:relative;width:150px;height:5px;margin-top:4px}#ki>i{background:linear-gradient(90deg,#3d7bff,#9fd8ff);box-shadow:0 0 8px #5aa8ff}
#arw{font-size:12px;margin-top:6px;letter-spacing:1px;text-shadow:0 1px 3px #000}
#arw b{color:var(--gold);font-weight:800}
#info{position:absolute;right:14px;top:10px;text-align:right;text-shadow:0 1px 4px #000}
#info .w{font-family:'Yuji Syuku',serif;font-size:26px;color:var(--paper)}
#info .w em{font-style:normal;color:var(--red)}
#info .s{font-size:12px;letter-spacing:3px;color:var(--gold)}
#tgt{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center;display:none}
#tname{font-size:14px;letter-spacing:4px;margin-bottom:5px;text-shadow:0 0 8px #000,0 0 2px #000;color:var(--paper)}
#tname b{color:var(--red);letter-spacing:2px}
#thp{position:relative;width:260px;height:8px}#thp>i{background:linear-gradient(#ff6b52,#b0241a 55%,#6e120c)}
#tpo{position:relative;width:260px;height:7px;margin-top:4px;background:rgba(0,0,0,.45)}
#tpo>i,#post>i{margin:0 auto;background:linear-gradient(90deg,#ff7a14,#ffe28a 50%,#ff7a14);box-shadow:0 0 10px #ffa030}
#post{left:50%;bottom:14px;transform:translateX(-50%);width:34vw;max-width:320px;height:8px;opacity:0;transition:opacity .25s}
#post::after,#tpo::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:rgba(255,240,200,.7)}
#post.hot>i,#tpo.hot>i{background:linear-gradient(90deg,#ff2a14,#ffb36b 50%,#ff2a14);box-shadow:0 0 14px #ff3b1a}
#toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(1);font-size:30px;font-weight:800;color:#ffe9b8;text-shadow:0 0 16px #ff7a00,0 0 3px #000;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;letter-spacing:3px}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .6s}
#banner .k{font-family:'Yuji Syuku',serif;font-size:76px;color:var(--red);text-shadow:0 0 30px rgba(216,53,42,.55),0 3px 0 #000;line-height:1.05}
#banner .t{font-size:18px;letter-spacing:8px;color:var(--paper);text-shadow:0 2px 6px #000;border-top:1px solid rgba(217,180,106,.6);border-bottom:1px solid rgba(217,180,106,.6);padding:4px 18px;margin-top:6px}
#dmg{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(170,0,0,.9);opacity:0}
.perigo{position:absolute;font-family:'Yuji Syuku',serif;font-size:58px;color:#ff2a1a;text-shadow:0 0 24px #ff0000,0 0 6px #ff0000,0 3px 0 #000;transform:translate(-50%,-50%);display:none;animation:pg .25s ease-out}
@keyframes pg{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.mark{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(#fff 0,#ff3b2e 30%,rgba(255,0,0,0) 72%);box-shadow:0 0 22px 8px rgba(255,30,20,.75);transform:translate(-50%,-50%);display:none;animation:mk .6s ease-in-out infinite alternate}
@keyframes mk{to{box-shadow:0 0 30px 12px rgba(255,30,20,.95)}}
#ctl{position:fixed;inset:0;pointer-events:none;display:none}
#ctl.on{display:block}
#lz{position:absolute;left:0;bottom:0;width:44vw;height:62vh;pointer-events:auto}
#stick{position:absolute;width:118px;height:118px;border-radius:50%;border:1px solid rgba(217,180,106,.45);background:radial-gradient(rgba(0,0,0,.15),rgba(0,0,0,.4));left:40px;bottom:40px;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3e6d0,#b9a27a);box-shadow:0 3px 10px rgba(0,0,0,.6);opacity:.75}
.b{position:absolute;pointer-events:auto;border-radius:50%;border:1.5px solid rgba(217,180,106,.7);background:radial-gradient(circle at 50% 35%,rgba(60,20,26,.75),rgba(12,4,8,.8));box-shadow:0 4px 14px rgba(0,0,0,.55),inset 0 0 12px rgba(217,180,106,.15);color:var(--paper);font-family:'Yuji Syuku',serif;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;touch-action:none}
.b small{font-family:'Shippori Mincho',serif;font-size:8px;margin-top:3px;letter-spacing:1.5px;color:var(--gold)}
.b.dn{background:radial-gradient(circle,rgba(216,53,42,.85),rgba(110,18,12,.85));border-color:#ffe28a;transform:scale(.94)}
.b.big{width:80px;height:80px;font-size:32px}
.b.sm{width:58px;height:58px}
.b.off{opacity:.45}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,8,16,.45),rgba(8,2,5,.92));z-index:5;padding:16px;box-sizing:border-box;overflow:auto}
.ov.hide{display:none}
.box{text-align:center;max-width:580px;position:relative}
.sun{position:absolute;left:50%;top:-6px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(#ff5a3a,#c8261c 60%,rgba(200,38,28,0) 72%);opacity:.85;z-index:-1;filter:blur(1px)}
.kanji{font-family:'Yuji Syuku',serif;font-size:78px;color:#fff1dc;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.6);line-height:1.1;padding-top:22px}
.ov h1{margin:6px 0 0;font-size:28px;letter-spacing:10px;font-weight:800}
.sub{margin:6px 0 14px;color:var(--gold);letter-spacing:6px;font-size:13px}
#help{font-size:13px;line-height:1.7;text-align:left;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.2));padding:10px 14px;border-left:2px solid var(--red)}
.ov button{margin-top:14px;font-family:'Shippori Mincho',serif;font-size:19px;font-weight:800;letter-spacing:6px;color:#1a0709;background:linear-gradient(#ffe2a0,#d49a3a);border:0;padding:12px 34px;border-radius:2px;cursor:pointer;box-shadow:0 4px 18px rgba(217,150,58,.35)}
.ov button.ghost{background:transparent;color:var(--gold);border:1px solid rgba(217,180,106,.6);font-size:12px;letter-spacing:3px;padding:7px 14px;box-shadow:none;margin-left:8px}
.best{font-size:13px;color:var(--gold)}
#chap{position:fixed;inset:0;z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .7s;
  background:radial-gradient(ellipse at center,rgba(20,6,10,.82),rgba(4,1,3,.97))}
#chap.on{opacity:1}
#chap .cn{font-size:14px;letter-spacing:8px;color:var(--gold)}
#chap .ck{font-family:'Yuji Syuku',serif;font-size:min(30vw,170px);line-height:1.05;color:var(--red);text-shadow:0 0 40px rgba(216,53,42,.45);transform:scale(1.15);transition:transform 4s ease-out}
#chap.on .ck{transform:scale(1)}
#chap .ct{font-size:clamp(20px,5vw,32px);font-weight:800;letter-spacing:10px;margin-top:4px}
#chap .cv{font-style:italic;font-size:clamp(14px,3.6vw,18px);margin-top:16px;max-width:80vw;opacity:.9;border-top:1px solid rgba(217,180,106,.5);padding-top:12px}
#chap .cc{font-size:11px;letter-spacing:2px;color:var(--gold);margin-top:10px;opacity:.85}
#keyart{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
#menu{background:none}
#menu .box{background:radial-gradient(ellipse at center,rgba(8,2,5,.72),rgba(8,2,5,.35) 70%,rgba(8,2,5,0));padding:10px 18px 4px}
#info .c{font-size:10px;letter-spacing:3px;color:var(--paper);opacity:.75;margin-top:2px}
#godb{position:absolute;left:14px;top:62px;font-size:11px;letter-spacing:3px;color:#ffe9a0;text-shadow:0 0 10px #ffb000,0 0 2px #000;display:none;animation:gd 1.2s ease-in-out infinite alternate}
#godb.on{display:block}.seal.god{background:linear-gradient(#ffe08a,#c88a1a);color:#2a1000;box-shadow:0 0 18px #ffb000}
@keyframes gd{to{text-shadow:0 0 18px #ffd000,0 0 2px #000}}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9}

#hud .num{position:absolute;transform:translate(-50%,-50%);font-weight:800;text-shadow:0 0 6px #000,0 2px 0 #000;pointer-events:none;display:none;white-space:nowrap;font-family:'Shippori Mincho',serif}
.mk{position:absolute;transform:translate(-50%,-50%);font-family:'Yuji Syuku',serif;font-size:22px;text-shadow:0 0 10px currentColor,0 2px 0 #000;text-align:center;display:none;pointer-events:none;line-height:1}
.mk small{display:block;font-family:'Shippori Mincho',serif;font-size:9px;color:#f3e6d0;letter-spacing:1px;margin-top:2px}
.mk.edge{opacity:.8;font-size:18px}
#prompt{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);font-size:14px;letter-spacing:3px;color:#ffe9b8;text-shadow:0 0 10px #000;display:none}
#bAct{right:118px;bottom:206px;width:auto;height:44px;border-radius:22px;padding:0 16px;font-size:15px;display:none;letter-spacing:1px;background:radial-gradient(circle,rgba(216,140,42,.75),rgba(90,40,10,.85));border-color:#ffe28a;white-space:nowrap}
#bInv{position:fixed;right:14px;top:74px;width:44px;height:44px;border-radius:8px;font-size:22px;pointer-events:auto;z-index:3}
#ink{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle,#0a0306 60%,#000);clip-path:circle(0% at 50% 50%);transition:clip-path .7s cubic-bezier(.7,0,.3,1)}
#ink.on{clip-path:circle(150% at 50% 50%)}
#chap{z-index:7}
.panel{position:fixed;inset:0;z-index:8;background:radial-gradient(ellipse at top,rgba(30,8,14,.94),rgba(6,2,4,.97));overflow:auto;padding:14px;box-sizing:border-box;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel.hide{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tab{font-family:'Shippori Mincho',serif;font-weight:800;font-size:12px;letter-spacing:2px;background:rgba(0,0,0,.4);color:#f3e6d0;border:1px solid rgba(217,180,106,.4);padding:9px 12px;border-radius:2px;cursor:pointer}
.tab.on{background:linear-gradient(#ffe2a0,#d49a3a);color:#1a0709;border-color:#ffe2a0}.tab.sm{font-size:11px;padding:6px 9px}.tab.x{margin-left:auto;font-size:16px;padding:6px 14px}
.res{font-size:13px;margin-bottom:12px;color:#f3e6d0}.res b{color:#ffd060}.ok{color:#7aff9a}.bad{color:#ff6a5a}.dim{opacity:.55;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:12px;margin-bottom:14px;background:rgba(0,0,0,.35);padding:10px;border-left:2px solid #d8352a}
.stats div{display:flex;justify-content:space-between}.stats span{opacity:.75}.stats b{color:#ffe9b8}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.slot{background:rgba(0,0,0,.3);border:1px solid rgba(217,180,106,.3);padding:8px;cursor:pointer}.slot .sk{font-family:'Yuji Syuku',serif;font-size:26px;color:#d8352a;float:left;margin-right:8px}.slot .sn{font-size:11px;letter-spacing:3px;color:#d9b46a;margin-bottom:6px}
.empty{opacity:.5;font-size:12px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.card{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(0,0,0,.35));border:1px solid;border-left-width:4px;padding:7px 9px;cursor:pointer;position:relative;min-height:42px}
.card .ck{position:absolute;right:7px;top:5px;font-family:'Yuji Syuku',serif;font-size:20px;opacity:.35}.card .cn{font-weight:800;font-size:13px;padding-right:22px}.card .cs{font-size:10px;opacity:.75;margin-top:3px;letter-spacing:1px}
.card.sel{box-shadow:0 0 0 2px #fff,0 0 18px rgba(255,255,255,.25)}
.r0{border-color:#cfc7b6}.r0 .cn,.r0 .dn{color:#e8e0d0}.r1{border-color:#5aa8ff}.r1 .cn,.r1 .dn{color:#8ac4ff}.r2{border-color:#b878ff}.r2 .cn,.r2 .dn{color:#d0a8ff}
.r3{border-color:#ffb030;box-shadow:0 0 12px rgba(255,176,48,.25)}.r3 .cn,.r3 .dn{color:#ffd070}.r4{border-color:#ff4a3a;box-shadow:0 0 16px rgba(255,74,58,.35)}.r4 .cn,.r4 .dn{color:#ff8a7a}
.detail{position:sticky;bottom:0;margin-top:12px;background:rgba(10,3,6,.97);border:1px solid;border-top-width:3px;padding:12px}
.detail .dn{font-size:18px;font-weight:800}.detail .dr{font-size:11px;letter-spacing:1px;opacity:.85;margin:3px 0 8px}
.ln{font-size:13px;padding:2px 0;color:#d8eaff}.ln.base{color:#f3e6d0;font-weight:800}.ln.uq{color:#ff8a7a;font-style:italic;margin-top:4px}
.dbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mb{font-family:'Shippori Mincho',serif;font-weight:800;font-size:14px;letter-spacing:2px;background:linear-gradient(#ffe2a0,#d49a3a);color:#1a0709;border:0;padding:11px 16px;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.mb small{font-size:10px;font-weight:500;letter-spacing:1px;margin-top:2px}.mb.ghost{background:transparent;color:#d9b46a;border:1px solid rgba(217,180,106,.6)}.mb.lock{opacity:.4}.mb.cur{box-shadow:0 0 0 2px #fff}
.arts{display:grid;gap:8px}.art{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.35);border:1px solid rgba(217,180,106,.3);padding:10px;cursor:pointer}
.art.on{border-color:#ffd060;box-shadow:0 0 14px rgba(255,208,96,.3)}.art.lock{opacity:.45}.art .ak{font-family:'Yuji Syuku',serif;font-size:38px;color:#d8352a;width:46px;text-align:center}
.art .an{font-weight:800;font-size:15px}.art .an small{color:#ffd060;font-size:11px;margin-left:6px}.art .ad{font-size:12px;opacity:.85;margin-top:3px}
.hint{font-size:12px;opacity:.6;margin-top:10px}
#shrine{display:flex;align-items:center;justify-content:center}#shrine.hide{display:none}
#shrineB{max-width:460px;width:100%;text-align:center}
.sh .shk{font-family:'Yuji Syuku',serif;font-size:90px;color:#ffd060;text-shadow:0 0 30px rgba(255,200,80,.5);line-height:1}.sh .sht{font-size:18px;letter-spacing:6px;font-weight:800;margin-top:6px}.sh .shs{font-size:12px;color:#7aff9a;margin:6px 0 16px}
#shrineB .btns{display:flex;flex-direction:column;gap:9px}
#cont small{display:block;font-size:10px;letter-spacing:1px;font-weight:500;margin-top:2px}
</style>
</head>
<body>
<div id="vig"></div><div id="grain"></div><div id="flash"></div>
<div id="hud">
  <div id="godb">神 MODO DEUS</div>
  <div id="pl"><div class="seal" id="seal" title="Modo deus">影</div><div><div class="lbl">KAGE · 影</div><div class="bar" id="hp"><div id="hpGhost"></div><i style="position:relative"></i></div><div class="bar" id="ki"><i></i></div><div id="arw"></div></div></div>
  <div id="info"><div class="w"><span id="wlbl" style="font-size:12px;letter-spacing:3px;font-family:'Shippori Mincho'">MUNDO</span> <em id="wv">1</em></div><div class="s" id="sc"></div><div class="c" id="chapLbl"></div></div>
  <div id="tgt"><div id="tname"></div><div class="bar" id="thp"><i></i></div><div class="bar" id="tpo"><i></i></div></div>
  <div class="bar" id="post"><i></i></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="banner"><div class="k"></div><div class="t"></div></div>
  <div id="dmg"></div>
</div>
<div id="ctl">
  <div id="lz"><div id="stick"><div id="knob"></div></div></div>
  <button class="b" id="bInv">袋</button>
  <button class="b big" id="bAtk" style="right:24px;bottom:112px">斬<small>ATACAR</small></button>
  <button class="b big" id="bGrd" style="right:112px;bottom:36px">守<small>DEFENDER</small></button>
  <button class="b sm" id="bDodge" style="right:30px;bottom:34px">避<small>ESQUIVA</small></button>
  <button class="b sm" id="bHvy" style="right:118px;bottom:130px">重<small>FORTE</small></button>
  <button class="b sm" id="bJump" style="right:204px;bottom:22px">跳<small>PULO</small></button>
  <button class="b sm" id="bArt" style="right:34px;bottom:206px">技<small>ARTE</small></button>
  <button class="b sm" id="bLock" style="right:198px;bottom:98px">◎<small>TRAVAR</small></button>
  <button class="b sm" id="bHeal" style="right:200px;bottom:168px">薬<small>CURA</small></button>
  <button class="b" id="bAct"></button>
</div>
<div id="menu" class="ov"><div class="box">
  <div class="kanji">影の剣</div><h1>KAGE NO KEN</h1><p class="sub">LÂMINA DAS SOMBRAS</p><p class="best" style="margin:-6px 0 12px;letter-spacing:2px">5 mundos inspirados nas obras de André Wenningkamp<br>小鳥 Passarinho · 海 Quero o mar, mãe · 真 A verdade · 祈 Oração · 影 Eu e a sombra</p>
  <div id="help"></div>
  <button id="cont">CONTINUAR<small></small></button> <button id="start">NOVO JOGO</button><br><button class="ghost" id="qbtn"></button><button class="ghost" id="godbtn"></button>
</div></div>
<div id="dead" class="ov hide"><div class="box">
  <div class="kanji" style="color:#d8352a">死</div><h1>VOCÊ CAIU</h1><p class="sub" id="dvs"></p>
  <button id="respawn">RENASCER NO SANTUÁRIO</button>
</div></div>
<div id="inv" class="panel hide"><div id="invB"></div></div>
<div id="shrine" class="panel hide"><div id="shrineB"></div></div>
<div id="ink"></div>
<div id="chap"><div class="cn" id="chN"></div><div class="ck" id="chK"></div><div class="ct" id="chT"></div><div class="cv" id="chV"></div><div class="cc" id="chC"></div></div>
<div id="err">Não foi possível carregar o motor 3D. Verifique a conexão e recarregue a página.</div>

<script src="three.min.js"></script>
<script>if(!window.THREE)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
(()=>{
if(!window.THREE){document.getElementById('err').style.display='flex';return;}

function mountains(S,base){[[base,S.mount[0],16,36,60],[base+45,S.mount[1],20,50,95],[base+105,S.mount[2],16,70,130]].forEach(([R,col,n,w0,h0])=>{
  for(let i=0;i<n;i++){const a=i/n*TAU+rand(-.15,.15),h=rand(h0*.5,h0)*(S.sea?.6:1),rad=rand(w0*.7,w0),seg=5+Math.floor(rand(0,3));
    if(S.sea&&Math.cos(a-Math.atan2(S.sunDir[0],S.sunDir[2]))>.55)continue;
    const m=new THREE.Mesh(new THREE.ConeGeometry(rad,h,seg),new THREE.MeshLambertMaterial({color:col,flatShading:true}));

let AC=null,NB,master;
function initAudio(){if(AC){AC.resume&&AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function noise(t,dur,type,f0,f1,g){const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f0,t);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const gn=AC.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(gn);gn.connect(master);s.start(t);s.stop(t+dur+.05);}
function tone(t,f,dur,type,g,f1){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const gn=AC.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.05);}
function sfx(n){if(!AC)return;const t=AC.currentTime;try{switch(n){
  case'swing':noise(t,.16,'bandpass',500,2600,.3);break;
  case'clang':[1500,2300,3400].forEach(f=>tone(t,f,.35,'triangle',.08));noise(t,.06,'highpass',3000,0,.35);break;
  case'parry':[2100,3150,4700,6200].forEach(f=>tone(t,f,.75,'sine',.11));noise(t,.08,'highpass',4000,0,.55);tone(t,900,.2,'square',.05,400);break;
  case'hit':noise(t,.18,'lowpass',1200,200,.7);tone(t,160,.15,'sine',.4,60);break;
  case'bow':tone(t,330,.12,'triangle',.25,110);noise(t,.1,'bandpass',1800,600,.2);break;
  case'fire':noise(t,.6,'lowpass',2200,180,.5);tone(t,90,.45,'sawtooth',.12,40);break;
  case'boom':noise(t,.9,'lowpass',900,60,1);tone(t,70,.7,'sine',.6,30);break;
  case'perigo':tone(t,520,.5,'sine',.25);tone(t,780,.5,'sine',.15);break;
  case'break':tone(t,200,.6,'sawtooth',.15,60);noise(t,.3,'bandpass',800,200,.5);break;
  case'deathblow':noise(t,.5,'lowpass',3000,100,.9);tone(t,55,1,'sine',.7,30);tone(t,1200,.4,'triangle',.08,300);break;
  case'gong':tone(t,110,2.5,'sine',.4);tone(t,220.5,2,'sine',.2);tone(t,331,1.5,'sine',.1);break;
  case'chirp':for(let i=0;i<3;i++){tone(t+i*.11,rand(2200,2800),.08,'sine',.035,rand(3200,4000));}break;
  case'wave':noise(t,2.6,'lowpass',500,180,.14);break;
  case'bell':tone(t,784,2.8,'sine',.05);tone(t,1176,2.2,'sine',.025);tone(t,1568,1.4,'sine',.015);break;
  case'wind':noise(t,2.4,'bandpass',300,700,.07);break;
  case'koto':{const sc=[293.7,311.1,392,440,466.2,587.3,622.3,784];const f=sc[Math.floor(Math.random()*sc.length)];tone(t,f,1.6,'triangle',.05);tone(t,f*2,.6,'sine',.02);break;}
}}catch(e){}}

function updLoot(dt,rt){for(const l of loot){l.t+=dt;l.core.rotation.y+=dt*2.5;l.core.position.y+=Math.sin(rt*3+l.t)*.003;

function updMove(dt){const d=MOVES[P.mvId],m=P.m,t=P.t*P.mvSpd,fw=pFwd();
  if(P.lunge>0){P.pos.addScaledVector(fw,P.lunge*dt);P.lunge*=Math.pow(.0005,dt);}
  const h0=d.hits.length?d.hits[0][0]:.15,ph=ease((t-.03)/Math.max(.08,h0+.02));
  switch(d.anim){
    case'v':pose(m,-2.6+3.1*ph,0,0,1);break;
    case'h1':pose(m,-1.5,1.6-3.2*ph,1.5,1);break;
    case'h2':pose(m,-1.5,-1.6+3.2*ph,1.5,1);break;
    case'thrust':pose(m,-1.5,0,1.5,1);m.rig.rotation.x=.25*ph;break;
    case'rise':pose(m,.5-2.9*ph,0,0,1);break;
    case'spin':pose(m,-1.5,0,1.5,1);P.spin=t/d.dur*TAU*2;break;
    case'wave':{const k=(t%.3)/.3;pose(m,-1.5,(Math.floor(t/.3)%2?-1:1)*(1.6-3.2*ease(k*1.6)),1.5,1);break;}
    case'iai':if(t<.6){pose(m,-.3,.9,-.6,.2);FX.ca=Math.max(FX.ca,.008);m.bladeMat.emissive.setRGB(t,t,t*1.2);}else{pose(m,-1.5,1.8-3.6*ease((t-.6)/.08),1.5,1);m.bladeMat.emissive.setHex(0);}break;
    case'leap':pose(m,t>.55?-2.6+3.1*ease((t-.55)/.1):-2.6,0,0,t>.55?1:.3);if(t<.62)P.pos.addScaledVector(P.leapV,dt);break;
    case'flurry':{const k=(t%.15)/.15;pose(m,-1.5,(Math.floor(t/.15)%2?-1:1)*(1.6-3.2*ease(k*2)),1.5,1);break;}
    case'plunge':pose(m,-2.6,0,0,.4);m.rig.rotation.x=.3;if(t>2)endMove();break;
    case'land':pose(m,.5,0,0,.4);m.rig.rotation.x=.2*(1-t/d.dur);break;
    case'pray':pose(m,-1.9,.6,-.3,.3);break;}
  P.trail=t>.02&&!['plunge','land','pray'].includes(d.anim)&&(d.anim!=='iai'||t>.58)&&(d.anim!=='leap'||t>.5)||d.anim==='plunge';
  while(P.hitIdx<d.hits.length&&t>=d.hits[P.hitIdx][0]){const h=d.hits[P.hitIdx];P.hitIdx++;onMoveHit(d,h);}
  if(P.state==='move'&&t>=d.dur){if(P.queued&&/^c[123]$/.test(P.mvId))startMove('c'+(+P.mvId[1]+1));else endMove();}}

  if(game==='play'&&!paused){if(MODE==='world'){list.push({p:GATE.clone().add(new V(0,9,0)),k:'闘',c:'#ff5a4a'});list.push({p:SHRINE.clone().add(new V(0,4,0)),k:'祠',c:'#ffd060'});
      for(const it of interact)if(it.type==='chest'&&!it.opened&&it.pos.distanceTo(P.pos)<38)list.push({p:it.pos.clone().add(new V(0,1.8,0)),k:'箱',c:'#ffe08a'});}
    else for(const it of interact)if(it.type==='exit')list.push({p:it.pos.clone().add(new V(0,6,0)),k:'門',c:'#8ad8ff'});}
  MK.forEach((el,i)=>{const t=list[i];if(!t){el.style.display='none';return;}const q=projXY(t.p);let x=q.x,y=q.y;const W=innerWidth,H=innerHeight;
    if(q.z>1){x=W-x;y=H-y;}const off=q.z>1||x<30||x>W-30||y<40||y>H-40;if(off){const cx=W/2,cy=H/2,dx=x-cx,dy=y-cy,s=Math.min((W/2-34)/Math.abs(dx||1),(H/2-44)/Math.abs(dy||1));x=cx+dx*s;y=cy+dy*s;}
    el.style.display='block';el.style.left=x+'px';el.style.top=y+'px';el.style.color=t.c;el.innerHTML=t.k+'<small>'+Math.round(t.p.distanceTo(P.pos))+'m</small>';el.classList.toggle('edge',off);});}

let cardTO;

const NUM='一二三四五';

function enterWorld(i,at){collectAll();clearEnemies();SV.world=i;buildStage(i,'world',SV.chests[i]);
  const pos=at==='gate'?GATE.clone().add(new V(0,0,12)):SHRINE.clone().add(new V(0,0,-5));resetPlayer(pos,Math.PI);camYaw=Math.PI;
  if(at!=='gate'){P.hp=P.maxHp;P.gourd=gourdMax();}spawnCamps();arenaState='idle';save();}
function enterArena(){collectAll();clearEnemies();buildStage(STAGE,'arena');resetPlayer(new V(0,0,18),Math.PI);camYaw=Math.PI;P.gourd=gourdMax();

function startArenaWave(n){arenaWave=n;const t=tier();const sp=()=>{const a=rand(0,TAU),R=rand(16,24);return new V(Math.sin(a)*R,0,Math.cos(a)*R-4);};
  if(n===1){for(let i=0;i<2+Math.min(2,Math.floor(t/2));i++)spawn('ronin',sp(),true);banner('PROVAÇÃO I','一');}
  if(n===2){spawn('ronin',sp(),true);spawn('archer',sp(),true);spawn('brute',sp(),true);if(t>2)spawn('ronin',sp(),true);banner('PROVAÇÃO II','二');}
  if(n===3){spawn('boss',new V(0,0,-14),true);if(SV.cycle>0)spawn('ronin',sp(),true);const B=STAGES[STAGE].boss;banner(B.name.toUpperCase(),B.kj);}

function arenaLogic(rd){if(MODE!=='arena')return;
  if(arenaState==='fight'&&alive().length===0){if(arenaWave<3){arenaState='pause';arenaT=2.6;banner('VITÓRIA','清');P.gourd=Math.min(gourdMax(),P.gourd+1);}else{arenaState='won';onArenaWin();}}
  if(arenaState==='pause'){arenaT-=rd;if(arenaT<=0)startArenaWave(arenaWave+1);}}
function onArenaWin(){const first=!SV.cleared[STAGE];SV.cleared[STAGE]=1;
  banner('PROVAÇÃO SUPERADA','勝');sfx('gong');
  if(first){const art=ARTS.find(a=>a.from===STAGE);if(art&&!SV.arts.includes(art.id)){SV.arts.push(art.id);setTimeout(()=>toast('NOVA ARTE: '+art.kj+' '+art.n.toUpperCase(),'#ffe08a'),2000);}
    if(STAGE<4&&SV.unlocked<STAGE+2){SV.unlocked=STAGE+2;setTimeout(()=>toast('NOVO MUNDO DESBLOQUEADO: '+STAGES[STAGE+1].title,'#ffd060'),3800);}
    if(STAGE===4){setTimeout(()=>{SV.cycle++;SV.cleared=[0,0,0,0,0];SV.chests=[[],[],[],[],[]];banner('CICLO '+(SV.cycle+1)+' — O MUNDO RENASCE','輪');save();},5000);}}
  toriiAt(STAGES[STAGE],0,-6,0,1.1,0x8ad8ff);interact.push({type:'exit',pos:new V(0,0,-6),r:4,label:'門 VOLTAR AO MUNDO'});save();}
function onDeath(){game='dead';const lost=Math.floor(SV.coins*.3);SV.coins-=lost;save();
  $('dvs').textContent=(MODE==='arena'?'Caiu na arena de ':'Caiu em ')+STAGES[STAGE].title+(lost?' · perdeu '+lost+' 銭':'');$('dead').classList.remove('hide');$('ctl').classList.remove('on');}
function respawn(){$('dead').classList.add('hide');game='play';if(TOUCH)$('ctl').classList.add('on');transition(()=>{calcStats();enterWorld(STAGE,'shrine');P.velaUsed=false;},null);}
function useAct(){if(!canAct()||!curAct)return;const a=curAct;
  if(a.type==='shrine')openShrine();
  else if(a.type==='chest')openChest(a);
  else if(a.type==='gate'){const B=STAGES[STAGE].boss;transition(enterArena,{n:'闘 ARENA'+(SV.cleared[STAGE]?' · REVANCHE':''),k:'闘',t:'PROVAÇÃO DE '+B.name.toUpperCase(),v:'Três provações. Uma lâmina.',c:STAGES[STAGE].title,dur:2600});}
  else if(a.type==='exit')transition(()=>enterWorld(STAGE,'gate'),null);}
function updInteract(){curAct=null;if(game!=='play')return;let bd=1e9;for(const it of interact){if(it.type==='chest'&&it.opened)continue;const d=Math.hypot(it.pos.x-P.pos.x,it.pos.z-P.pos.z);if(d<it.r&&d<bd){bd=d;curAct=it;}}
  if(curAct&&curAct.type==='gate'&&alive().some(e=>e.aggro&&e.pos.distanceTo(P.pos)<20)){curAct=null;}}

  if(view==='travel'){h+='<div class="btns">';STAGES.forEach((s,i)=>{const lk=i>=SV.unlocked;h+='<button class="mb'+(lk?' lock':'')+(i===STAGE?' cur':'')+'" data-a="go" data-i="'+i+'"'+(lk?' disabled':'')+'>'+s.kj+' '+s.title+(lk?' 🔒':SV.cleared[i]?' ✓':'')+'</button>';});h+='<button class="mb ghost" data-a="back">VOLTAR</button></div>';}

let invTab='eq',invSel=null,invFilter=null,confirmSalv=null;
function openInv(tab){invTab=tab||'eq';invSel=null;confirmSalv=null;pause(true);renderInv();$('inv').classList.remove('hide');}
function closeInv(){$('inv').classList.add('hide');if(atShrine){renderShrine();$('shrine').classList.remove('hide');}else pause(false);}
const fmt=(k,v,u)=>(v>0?'+':'')+(Math.round(v*10)/10)+(u||'')+' '+STATN[k];
function itemLines(it){const m=1+.1*it.lvl;let h='';for(const k in it.base)h+='<div class="ln base">'+fmt(k,it.base[k]*m,BASEU[k])+'</div>';
  for(const a of it.aff)h+='<div class="ln">'+fmt(a.k,a.v*m,AFF[a.k].u)+'</div>';if(it.uniq){const u=UNIQ.find(x=>x.id===it.uniq);h+='<div class="ln uq">✦ '+u.desc+'</div>';}return h;}
function upCost(it){return{c:Math.round(40*(it.lvl+1)*(1+it.rar*.6)*(1+it.tier*.3)),m:it.lvl+1+it.rar,mat:SLOTS[it.slot].mat};}
function salvVal(it){return{m:1+it.rar*2+Math.floor(it.lvl/2),c:10*(1+it.rar)*(1+it.tier),mat:SLOTS[it.slot].mat};}
function power(it){if(!it)return 0;const m=1+.1*it.lvl;let p=0;for(const k in it.base)p+=it.base[k]*m*(k==='dmg'?3:k==='post'?1.5:k==='hp'?.6:k==='def'?3:1);for(const a of it.aff)p+=a.v*m*1.2;return Math.round(p*(it.uniq?1.3:1));}
function card(it){const eq=SV.eq[it.slot]===it.id;return'<div class="card r'+it.rar+(invSel===it.id?' sel':'')+'" data-id="'+it.id+'"><div class="ck">'+SLOTS[it.slot].kj+'</div><div class="cn">'+it.name+(it.lvl?' +'+it.lvl:'')+'</div><div class="cs">'+RAR[it.rar].n+' · P'+power(it)+(eq?' · <b>EQUIPADO</b>':'')+'</div></div>';}
function renderInv(){let h='<div class="tabs">'+[['eq','装 EQUIPAMENTO'],['bag','袋 BOLSA ('+SV.inv.length+'/40)'],['art','技 ARTES']].map(t=>'<button class="tab'+(invTab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'<button class="tab x" data-a="close">✕</button></div>';
  h+='<div class="res">銭 <b>'+SV.coins.toLocaleString('pt-BR')+'</b>'+Object.keys(MATS).map(k=>' &nbsp; <span style="color:'+MATS[k].c+'">'+MATS[k].kj+'</span> <b>'+SV.mats[k]+'</b>').join('')+' &nbsp; 薬 <b>'+gourdMax()+'</b>'+(atShrine?' &nbsp; <span class="ok">鍛 FORJA ATIVA</span>':' &nbsp; <span class="dim">forja só no santuário</span>')+'</div>';
  if(invTab==='eq'){h+='<div class="stats">'+[['Dano',ST.dmg.toFixed(1)],['Postura',ST.post.toFixed(1)],['Vida',ST.hp],['Defesa',ST.def.toFixed(1)+'%'],['Vel. ataque',Math.round(ST.spd*100)+'%'],['Crítico',ST.crit.toFixed(1)+'% · +'+Math.round(ST.critDmg)+'%'],
      ['Roubo de vida',ST.ls.toFixed(1)+'%'],['Espírito',Math.round(ST.spReg*100)+'%'],['Deflexão',Math.round(ST.defl*1000)+'ms'],['Resist. postura',ST.pres.toFixed(1)+'%'],['Moedas',' +'+Math.round(ST.coin)+'%'],['Cura',' +'+Math.round(ST.heal)+'%']].map(s=>'<div><span>'+s[0]+'</span><b>'+s[1]+'</b></div>').join('')+'</div>';
    h+='<div class="slots">'+SLOT_KEYS.map(sl=>{const it=itemById(SV.eq[sl]);return'<div class="slot" data-slot="'+sl+'"><div class="sk">'+SLOTS[sl].kj+'</div><div class="sn">'+SLOTS[sl].n+'</div>'+(it?card(it):'<div class="empty">vazio</div>')+'</div>';}).join('')+'</div>';
    h+='<div class="hint">Toque num espaço para ver os itens daquele tipo.</div>';}
  if(invTab==='bag'){h+='<div class="filters">'+[[null,'TODOS']].concat(SLOT_KEYS.map(s=>[s,SLOTS[s].kj+' '+SLOTS[s].n])).map(f=>'<button class="tab sm'+(invFilter===f[0]?' on':'')+'" data-f="'+(f[0]||'')+'">'+f[1]+'</button>').join('')+'</div>';
    const list=SV.inv.filter(it=>!invFilter||it.slot===invFilter).sort((a,b)=>(SV.eq[b.slot]===b.id)-(SV.eq[a.slot]===a.id)||b.rar-a.rar||power(b)-power(a));
    h+='<div class="grid">'+(list.length?list.map(card).join(''):'<div class="hint">Nada aqui ainda. Derrote inimigos e abra baús.</div>')+'</div>';}
  if(invTab==='art'){h+='<div class="arts">'+ARTS.map(a=>{const ok=SV.arts.includes(a.id);return'<div class="art'+(SV.art===a.id?' on':'')+(ok?'':' lock')+'" data-art="'+a.id+'"><div class="ak">'+a.kj+'</div><div><div class="an">'+a.n+' <small>'+a.cost+' 魂</small></div><div class="ad">'+(ok?a.desc:'Bloqueada · vença a arena de '+STAGES[a.from].title)+'</div></div></div>';}).join('')+'</div>';}
  const it=invSel&&itemById(invSel);
  if(it&&invTab!=='art'){const cur=itemById(SV.eq[it.slot]);const eq=cur&&cur.id===it.id;const uc=upCost(it),sv=salvVal(it);const dp=power(it)-power(cur);
    h+='<div class="detail r'+it.rar+'"><div class="dn">'+it.name+(it.lvl?' +'+it.lvl:'')+'</div><div class="dr">'+RAR[it.rar].n+' · '+SLOTS[it.slot].n+' · Mundo '+(it.tier+1)+' · Poder '+power(it)+(eq?'':' <span class="'+(dp>=0?'ok':'bad')+'">('+(dp>=0?'+':'')+dp+' vs equipado)</span>')+'</div>'+itemLines(it);
    h+='<div class="dbtns">'+(eq?'':'<button class="mb" data-a="equip">EQUIPAR</button>');
    if(it.lvl<10)h+='<button class="mb'+(atShrine?'':' lock')+'" data-a="up"'+(atShrine?'':' disabled')+'>鍛 MELHORAR +'+(it.lvl+1)+' <small>'+uc.c+' 銭 · '+uc.m+' '+MATS[uc.mat].kj+'</small></button>';else h+='<div class="ok">NÍVEL MÁXIMO</div>';
    if(!eq)h+='<button class="mb ghost" data-a="salv">'+(confirmSalv===it.id?'CONFIRMAR?':'分 DESMONTAR')+' <small>+'+sv.m+' '+MATS[sv.mat].kj+' · +'+sv.c+' 銭</small></button>';
    h+='</div></div>';}
  $('invB').innerHTML=h;}
$('inv').addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-a],[data-id],[data-slot],[data-f],[data-art]');if(!t)return;
  if(t.dataset.tab){invTab=t.dataset.tab;invSel=null;}
  else if(t.dataset.f!==undefined){invFilter=t.dataset.f||null;}
  else if(t.dataset.art){if(SV.arts.includes(t.dataset.art)){SV.art=t.dataset.art;sfx('clang');saveSoon();}}
  else if(t.dataset.id){invSel=+t.dataset.id;confirmSalv=null;}
  else if(t.dataset.slot){invFilter=t.dataset.slot;invTab='bag';invSel=null;}
  else if(t.dataset.a){const a=t.dataset.a,it=invSel&&itemById(invSel);
    if(a==='close'){closeInv();return;}
    if(a==='equip'&&it){SV.eq[it.slot]=it.id;calcStats();sfx('clang');saveSoon();}
    if(a==='up'&&it&&atShrine){const c=upCost(it);if(SV.coins<c.c||SV.mats[c.mat]<c.m){toast('Recursos insuficientes');}else{SV.coins-=c.c;SV.mats[c.mat]-=c.m;it.lvl++;calcStats();sfx('parry');toast('鍛  '+it.name+' +'+it.lvl,RAR[it.rar].c);save();}}
    if(a==='salv'&&it){if(confirmSalv!==it.id){confirmSalv=it.id;}else{const v=salvVal(it);SV.mats[v.mat]+=v.m;SV.coins+=v.c;SV.inv=SV.inv.filter(x=>x.id!==it.id);invSel=null;confirmSalv=null;sfx('break');saveSoon();}}}
  renderInv();});

const FX={mono:0,zoom:0,ca:0};
const POST=HIGH;
const post=(()=>{if(!POST)return null;
  const VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
  const opt={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat};

  const rtS=ms?new THREE.WebGLMultisampleRenderTarget(4,4,opt):new THREE.WebGLRenderTarget(4,4,opt);if(ms)rtS.samples=4;
  const rtA=new THREE.WebGLRenderTarget(4,4,opt),rtB=new THREE.WebGLRenderTarget(4,4,opt),rtR=new THREE.WebGLRenderTarget(4,4,opt);
  const cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1),geo=new THREE.PlaneGeometry(2,2);
  function pass(fs,uniforms){const mat=new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:fs,uniforms,depthTest:false,depthWrite:false});const sc=new THREE.Scene();sc.add(new THREE.Mesh(geo,mat));return{sc,u:uniforms};}
  const bright=pass(`uniform sampler2D tD;uniform vec2 px;uniform float thr;varying vec2 vUv;
    void main(){vec3 c=texture2D(tD,vUv+px*vec2(-1.5,-1.5)).rgb+texture2D(tD,vUv+px*vec2(1.5,-1.5)).rgb+texture2D(tD,vUv+px*vec2(-1.5,1.5)).rgb+texture2D(tD,vUv+px*vec2(1.5,1.5)).rgb;c*=.25;
    float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(thr,thr+.3,l)*1.4,1.);}`,{tD:{value:null},px:{value:new THREE.Vector2()},thr:{value:.62}});
  const blur=pass(`uniform sampler2D tD;uniform vec2 dir;varying vec2 vUv;
    void main(){vec3 c=texture2D(tD,vUv).rgb*.227027;c+=(texture2D(tD,vUv+dir*1.3846).rgb+texture2D(tD,vUv-dir*1.3846).rgb)*.316216;
    c+=(texture2D(tD,vUv+dir*3.2307).rgb+texture2D(tD,vUv-dir*3.2307).rgb)*.07027;gl_FragColor=vec4(c,1.);}`,{tD:{value:null},dir:{value:new THREE.Vector2()}});
  const rays=pass(`uniform sampler2D tD;uniform vec2 sun;uniform float vis;varying vec2 vUv;
    void main(){vec2 d=(vUv-sun)/40.;vec2 uv=vUv;float w=1.;vec3 c=vec3(0.);
    for(int i=0;i<40;i++){uv-=d;float m=1.-smoothstep(.0,.45,distance(uv,sun));c+=texture2D(tD,uv).rgb*w*(.25+m);w*=.95;}
    gl_FragColor=vec4(c*.11*vis,1.);}`,{tD:{value:null},sun:{value:new THREE.Vector2(.5,.5)},vis:{value:0}});
  const comp=pass(`uniform sampler2D tS,tB,tR;uniform vec2 res;uniform float time,ca,zoom,mono,lowhp,bloomK,raysK,edgeK,sat;uniform vec3 tint,shad;varying vec2 vUv;
    float rnd(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
    float L(vec2 u){return lum(texture2D(tS,u).rgb);}
    void main(){vec2 dc=vUv-.5;float r2=dot(dc,dc);
      vec2 uv=.5+dc*(1.-r2*(.06+zoom*.05));
      vec2 dir=dc*(ca+.0035)*(.6+r2*4.);
      vec3 col=vec3(0.);
      if(zoom>.02){for(int i=0;i<10;i++){float f=float(i)/10.*zoom*.075;vec2 u=uv-dc*f;col+=vec3(texture2D(tS,u+dir).r,texture2D(tS,u).g,texture2D(tS,u-dir).b);}col/=10.;}
      else col=vec3(texture2D(tS,uv+dir).r,texture2D(tS,uv).g,texture2D(tS,uv-dir).b);
      vec2 p=1./res*1.2;
      float tl=L(uv+p*vec2(-1,1)),t=L(uv+p*vec2(0,1)),tr=L(uv+p*vec2(1,1)),l=L(uv+p*vec2(-1,0)),r=L(uv+p*vec2(1,0)),bl=L(uv+p*vec2(-1,-1)),b=L(uv+p*vec2(0,-1)),br=L(uv+p*vec2(1,-1));
      float gx=-tl-2.*l-bl+tr+2.*r+br,gy=-bl-2.*b-br+tl+2.*t+tr;float e=smoothstep(.16,.5,sqrt(gx*gx+gy*gy));
      col=mix(col,col*.12,e*edgeK);
      col+=texture2D(tB,uv).rgb*bloomK*1.35+texture2D(tR,uv).rgb*raysK;
      float Lm=lum(col);col=mix(vec3(Lm),col,sat);col=(col-.5)*1.12+.5;
      col*=mix(shad,tint,smoothstep(.0,.75,Lm));
      float red=smoothstep(.12,.45,col.r-max(col.g,col.b));
      vec3 m=vec3(smoothstep(.22,.55,Lm))*vec3(1.,.97,.92);m=mix(m,vec3(1.,.06,.04)*max(Lm*1.8,.55),red);
      col=mix(col,m,mono);
      col=mix(col,vec3(lum(col))*vec3(1.15,.82,.82),lowhp*.65);
      float v=1.-smoothstep(.22,.9,length(dc*vec2(1.,.85)));col*=mix(.28,1.,v);
      col+=vec3(.6,0.,.02)*(1.-v)*lowhp*(.55+.45*sin(time*7.));
      col+=(rnd(uv*res+fract(time))-.5)*.075;
      col*=.965+.035*sin(uv.y*res.y*1.3+time*30.);
      gl_FragColor=vec4(col,1.);}`,
    {tS:{value:null},tB:{value:null},tR:{value:null},res:{value:new THREE.Vector2()},time:{value:0},ca:{value:0},zoom:{value:0},mono:{value:0},lowhp:{value:0},
     bloomK:{value:1},raysK:{value:1},edgeK:{value:.8},sat:{value:1.25},tint:{value:new THREE.Vector3(1,1,1)},shad:{value:new THREE.Vector3(1,1,1)}});
  function size(){const pr=renderer.getPixelRatio(),W=Math.floor(innerWidth*pr),H=Math.floor(innerHeight*pr);rtS.setSize(W,H);
    const w=Math.max(1,W>>2),h=Math.max(1,H>>2);rtA.setSize(w,h);rtB.setSize(w,h);rtR.setSize(w,h);

  const sp=new V();
  const post={grade(g){comp.u.tint.value.set(...g.tint);comp.u.shad.value.set(...g.shad);comp.u.bloomK.value=g.bloom;comp.u.raysK.value=g.rays;comp.u.sat.value=g.sat;},
    render(rt){

      blur.u.tD.value=rtA.texture;blur.u.dir.value.set(1/post.w,0);renderer.setRenderTarget(rtB);renderer.render(blur.sc,cam);
      blur.u.tD.value=rtB.texture;blur.u.dir.value.set(0,1/post.h);renderer.setRenderTarget(rtA);renderer.render(blur.sc,cam);
      blur.u.tD.value=rtA.texture;blur.u.dir.value.set(2.6/post.w,0);renderer.setRenderTarget(rtB);renderer.render(blur.sc,cam);
      blur.u.tD.value=rtB.texture;blur.u.dir.value.set(0,2.6/post.h);renderer.setRenderTarget(rtA);renderer.render(blur.sc,cam);
      sp.copy(sunDisc.position).project(camera);const fwd=camera.getWorldDirection(new V());const dp=fwd.dot(sunDisc.position.clone().normalize());

window.__post=post;if(post){post.grade(STAGES[STAGE].post);document.getElementById('vig').style.display='none';document.getElementById('grain').style.display='none';}
function updFX(rd){FX.mono=Math.max(0,FX.mono-rd*(FX.mono>.6?1.6:3.2));FX.zoom=Math.max(0,FX.zoom-rd*3.2);FX.ca=Math.max(0,FX.ca-rd*.07);

  if(!bad.length)return;console.warn('shader falhou',bad.map(p=>p.name));
